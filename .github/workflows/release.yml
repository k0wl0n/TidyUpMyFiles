name: release

# Actions → release → Run workflow. "auto" picks the version from Conventional Commits since the last
# tag (see scripts/next-version.sh) and does nothing when there's nothing to release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  # Turn on once releasing every feat/fix merged to main is wanted:
  # push:
  #   branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          TAG="$(scripts/next-version.sh "$BUMP")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" ]]; then echo "Releasing $TAG" >> "$GITHUB_STEP_SUMMARY"; else echo "Nothing to release." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Test
        if: steps.version.outputs.tag != ''
        run: swift test --only-use-versions-from-resolved-file

      # Unsigned (ad hoc) build. With an Apple Developer ID, import the certificate into a keychain here
      # and set SIGN_IDENTITY and NOTARY_PROFILE for the next two steps.
      - name: Build the app
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Package the DMG and command line tool
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Record build provenance
        if: steps.version.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/TidyUpMyFiles-${{ steps.version.outputs.version }}.dmg
            build/tidyup-${{ steps.version.outputs.version }}-macos-universal.tar.gz

      - name: Tag and publish the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release-notes.sh "$TAG" > build/notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "TidyUpMyFiles $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --title "TidyUpMyFiles $TAG" --notes-file build/notes.md \
            "build/TidyUpMyFiles-$VERSION.dmg" \
            "build/tidyup-$VERSION-macos-universal.tar.gz" \
            build/checksums.txt

  homebrew:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Skip without a tap token
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAS_TAP_TOKEN == 'true'
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAS_TAP_TOKEN == 'true'
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update the formula and cask
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh release download "v$VERSION" --pattern checksums.txt --dir build --repo "$GITHUB_REPOSITORY"
          scripts/render-homebrew.sh "$VERSION" "$GITHUB_REPOSITORY" homebrew-tap
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tidyup.rb Casks/tidyupmyfiles.rb
          git commit -m "tidyup $VERSION"
          git push
