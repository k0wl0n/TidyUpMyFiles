name: Feature request
description: An idea to make tidying easier
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation, e.g. "I want invoices from my bank sorted by year".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: A condition, action, screen or setting you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried already?
